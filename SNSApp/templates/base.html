<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}よりみち{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/color.css') }}"
    />
    {% block page_css %}{% endblock %}
  </head>

  <body>
   {% include 'common/header.html' %}

    <main>{% block content %}{% endblock %}</main>
    {% block footer %} {% include 'common/footer.html' %} {% endblock %}

    <!-- ロック画面表示の処理 -->
    <script>
      const LOCK_URL = "/lock";
      const LOGIN_URL = "/login";

      async function checkLock() {
        try {
          const response = await fetch("/api", {
            headers: {
              "X-Requested-With": "XMLHttpRequest", //JSからの通信であることを示す合言葉
            },
          });

          const data = await response.json();

          const currentPath = window.location.pathname;

          if (data.is_locked) {
            //ロック時間中なのに、まだ /lock 画面にいない場合 → ロック画面へ移動
            if (currentPath !== LOCK_URL) {
              window.location.href = LOCK_URL;
            }
          } else {
            //ロック時間外なのに、まだ /lock 画面にいる場合 → ログイン画面へ移動
            if (currentPath === LOCK_URL) {
              window.location.href = LOGIN_URL;
            }
          }
        } catch (error) {
          console.error("ロック確認エラー:", error);
        }
      }

      //10秒ごとに実行
      setInterval(checkLock, 10000);
    </script>
  </body>
</html>
